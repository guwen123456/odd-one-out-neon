<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ODD ONE OUT: Neon Challenge</title>
  <style>
:root {
  --bg: #07070f;
  --neon-purple: #c084fc;
  --neon-blue: #22d3ee;
  --neon-pink: #f472b6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: #e2e8f0;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
#app { width: 100%; max-width: 520px; padding: 20px; }
.screen { display: none; text-align: center; animation: fadeIn 0.4s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.neon-title {
  font-size: 2.8rem; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-shadow: 0 0 30px rgba(192, 132, 252, 0.5); margin-bottom: 0.3rem;
}
.subtitle { color: var(--neon-blue); font-size: 1.2rem; letter-spacing: 4px; margin-bottom: 1.5rem; opacity: 0.9; }
.instructions { color: #94a3b8; margin-bottom: 2rem; font-size: 1rem; line-height: 1.5; }
.neon-btn {
  background: transparent; border: 2px solid var(--neon-purple); color: var(--neon-purple);
  padding: 14px 40px; font-size: 1.1rem; font-weight: 700; letter-spacing: 1px;
  border-radius: 50px; cursor: pointer; transition: all 0.2s ease;
  box-shadow: 0 0 15px rgba(192, 132, 252, 0.4); text-transform: uppercase;
}
.neon-btn:hover, .neon-btn:active { background: var(--neon-purple); color: #07070f; box-shadow: 0 0 30px var(--neon-purple); transform: scale(1.05); }
.high-score { margin-top: 1.5rem; color: #64748b; font-size: 0.95rem; }
.hud {
  display: flex; justify-content: space-between; margin-bottom: 20px; padding: 12px 16px;
  background: rgba(30, 27, 75, 0.6); border-radius: 16px; border: 1px solid rgba(192, 132, 252, 0.3); backdrop-filter: blur(10px);
}
.hud-item { font-size: 0.85rem; letter-spacing: 1px; color: #94a3b8; }
.hud-item span { display: block; font-size: 1.6rem; font-weight: 800; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); margin-top: 2px; }
.grid { display: grid; gap: 12px; justify-content: center; margin: 0 auto; max-width: 100%; }
.item {
  width: 72px; height: 72px; display: flex; align-items: center; justify-content: center;
  border-radius: 12px; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
  background: rgba(15, 23, 42, 0.8); border: 2px solid rgba(34, 211, 238, 0.3); position: relative; overflow: hidden;
}
.item:hover, .item:active { transform: scale(1.08); box-shadow: 0 0 20px var(--neon-blue); border-color: var(--neon-blue); }
.shape { width: 44px; height: 44px; flex-shrink: 0; }
.item.correct { animation: correctPulse 0.5s ease; border-color: #4ade80; box-shadow: 0 0 25px #4ade80; }
.item.wrong { animation: wrongShake 0.4s ease; border-color: #f87171; box-shadow: 0 0 25px #f87171; }
@keyframes correctPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
@keyframes wrongShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.feedback { margin-top: 16px; height: 28px; font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
.final-stats { margin: 1.5rem 0 2rem; font-size: 1.2rem; }
.final-stats p { margin: 0.5rem 0; }
.final-stats span { color: var(--neon-blue); font-weight: 800; font-size: 1.5rem; }
.new-record { color: #facc15; font-weight: 800; letter-spacing: 2px; animation: pulse 1s infinite; text-shadow: 0 0 15px #facc15; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
@media (max-width: 480px) {
  .neon-title { font-size: 2.2rem; }
  .item { width: 60px; height: 60px; }
  .shape { width: 36px; height: 36px; }
  .hud-item span { font-size: 1.4rem; }
  #app { padding: 12px; }
}
@media (min-width: 600px) {
  .item { width: 80px; height: 80px; }
  .shape { width: 48px; height: 48px; }
}
  </style>
</head>
<body>
  <div id="app">
    <div id="start-screen" class="screen active">
      <h1 class="neon-title">ODD ONE OUT</h1>
      <p class="subtitle">Neon Challenge</p>
      <p class="instructions">Find the unique pattern before time runs out!</p>
      <button id="start-btn" class="neon-btn">START GAME</button>
      <div class="high-score">Best: <span id="best-score">0</span></div>
    </div>

    <div id="game-screen" class="screen">
      <div class="hud">
        <div class="hud-item">TIME <span id="timer">60</span></div>
        <div class="hud-item">SCORE <span id="score">0</span></div>
        <div class="hud-item">COMBO <span id="combo">x0</span></div>
      </div>
      <div id="grid" class="grid"></div>
      <div id="feedback" class="feedback"></div>
    </div>

    <div id="end-screen" class="screen">
      <h2 class="neon-title">GAME OVER</h2>
      <div class="final-stats">
        <p>Score: <span id="final-score">0</span></p>
        <p>Best: <span id="final-best">0</span></p>
        <p id="new-record" class="new-record" style="display:none;">NEW RECORD!</p>
      </div>
      <button id="restart-btn" class="neon-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
// ODD ONE OUT: Neon Challenge - Single file version
const SHAPES = ['circle', 'square', 'triangle', 'diamond'];
const COLORS = ['#c084fc','#22d3ee','#f472b6','#a78bfa','#67e8f9','#fb7185','#818cf8','#38bdf8'];

const state = { score:0, combo:0, timer:60, highScore:0, timerId:null, isPlaying:false, currentOddIndex:-1, difficulty:1 };

const startScreen = document.getElementById('start-screen');
const gameScreen = document.getElementById('game-screen');
const endScreen = document.getElementById('end-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const grid = document.getElementById('grid');
const timerEl = document.getElementById('timer');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const feedbackEl = document.getElementById('feedback');
const finalScoreEl = document.getElementById('final-score');
const finalBestEl = document.getElementById('final-best');
const newRecordEl = document.getElementById('new-record');
const bestScoreEl = document.getElementById('best-score');

function loadHighScore() {
  try {
    const saved = localStorage.getItem('oddOneOutHighScore');
    state.highScore = saved ? parseInt(saved, 10) : 0;
    if (bestScoreEl) bestScoreEl.textContent = state.highScore;
  } catch (e) { state.highScore = 0; if (bestScoreEl) bestScoreEl.textContent = '0'; }
}
function saveHighScore() {
  try {
    if (state.score > state.highScore) {
      state.highScore = state.score;
      localStorage.setItem('oddOneOutHighScore', String(state.highScore));
      return true;
    }
  } catch (e) {}
  return state.score > state.highScore;
}
function showScreen(screen) {
  [startScreen, gameScreen, endScreen].forEach(s => s.classList.remove('active'));
  screen.classList.add('active');
}
function createShapeElement(shape, color, rotation) {
  const el = document.createElement('div');
  el.className = 'shape';
  el.style.background = color;
  el.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
  el.style.transform = `rotate(${rotation}deg)`;
  if (shape === 'circle') el.style.borderRadius = '50%';
  else if (shape === 'square') el.style.borderRadius = '8px';
  else if (shape === 'triangle') {
    el.style.clipPath = 'polygon(50% 0%, 0% 100%, 100% 100%)';
    el.style.filter = `drop-shadow(0 0 8px ${color})`;
    el.style.boxShadow = 'none';
  } else if (shape === 'diamond') {
    el.style.clipPath = 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)';
  }
  return el;
}
function getDifficulty() {
  if (state.score < 100) return 1;
  if (state.score < 250) return 2;
  if (state.score < 500) return 3;
  if (state.score < 800) return 4;
  return 5;
}
function generateRound() {
  state.difficulty = getDifficulty();
  const count = state.difficulty >= 3 ? 16 : 9;
  const cols = count === 16 ? 4 : 3;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';
  const types = ['color', 'shape', 'rotation'];
  const type = types[Math.floor(Math.random() * types.length)];
  const baseShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
  let baseColor = COLORS[Math.floor(Math.random() * COLORS.length)];
  let baseRotation = [0, 45, 90, 135][Math.floor(Math.random() * 4)];
  let oddShape = baseShape, oddColor = baseColor, oddRotation = baseRotation;
  if (type === 'color') {
    const available = COLORS.filter(c => c !== baseColor);
    oddColor = available[Math.floor(Math.random() * available.length)];
  } else if (type === 'shape') {
    const available = SHAPES.filter(s => s !== baseShape);
    oddShape = available[Math.floor(Math.random() * available.length)];
  } else {
    oddRotation = (baseRotation + 45) % 180;
  }
  state.currentOddIndex = Math.floor(Math.random() * count);
  for (let i = 0; i < count; i++) {
    const isOdd = i === state.currentOddIndex;
    const item = document.createElement('div');
    item.className = 'item';
    item.appendChild(createShapeElement(isOdd ? oddShape : baseShape, isOdd ? oddColor : baseColor, isOdd ? oddRotation : baseRotation));
    item.addEventListener('click', () => handleClick(i, item));
    grid.appendChild(item);
  }
}
function handleClick(index, element) {
  if (!state.isPlaying) return;
  if (index === state.currentOddIndex) {
    state.combo++;
    const points = 10 + (state.combo - 1) * 5;
    state.score += points;
    scoreEl.textContent = state.score;
    comboEl.textContent = `x${state.combo}`;
    element.classList.add('correct');
    feedbackEl.textContent = `+${points}  COMBO x${state.combo}`;
    feedbackEl.style.color = '#4ade80';
    setTimeout(() => { generateRound(); feedbackEl.textContent = ''; }, 400);
  } else {
    state.combo = 0;
    comboEl.textContent = 'x0';
    state.timer = Math.max(0, state.timer - 5);
    timerEl.textContent = state.timer;
    element.classList.add('wrong');
    feedbackEl.textContent = '-5s';
    feedbackEl.style.color = '#f87171';
    setTimeout(() => { element.classList.remove('wrong'); feedbackEl.textContent = ''; }, 500);
    if (state.timer <= 0) endGame();
  }
}
function startTimer() {
  if (state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(() => {
    if (!state.isPlaying) return;
    state.timer--;
    timerEl.textContent = state.timer;
    if (state.timer <= 0) endGame();
  }, 1000);
}
function startGame() {
  state.score = 0; state.combo = 0; state.timer = 60; state.isPlaying = true;
  scoreEl.textContent = '0'; comboEl.textContent = 'x0'; timerEl.textContent = '60'; feedbackEl.textContent = '';
  showScreen(gameScreen);
  generateRound();
  startTimer();
}
function endGame() {
  state.isPlaying = false;
  if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  const isNew = saveHighScore();
  finalScoreEl.textContent = state.score;
  finalBestEl.textContent = state.highScore;
  newRecordEl.style.display = isNew ? 'block' : 'none';
  showScreen(endScreen);
}
function init() {
  loadHighScore();
  if (startBtn) { startBtn.onclick = startGame; }
  if (restartBtn) { restartBtn.onclick = startGame; }
}
init();
  </script>
</body>
</html>
